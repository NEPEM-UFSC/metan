# Informational CI workflow (Phase 2 of the metan quality-improvement plan).
#
# This runs R CMD check + testthat on every push/PR but is intentionally NOT
# wired up as a required status check yet, so it does not block merging.
# It exists purely to give visibility into whether changes break the build
# or the regression tests introduced in tests/testthat/. Once confidence is
# built up, this check can be marked "required" in the repo's branch
# protection settings.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check (informational)

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"never"'
